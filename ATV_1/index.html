
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Calculadora de Média</h1>

        <label>Nome do aluno</label>
        <input type="text" id="nome" placeholder="Digite seu nome">

        <label>Primeira nota</label>
        <input type="number" id="nota1" placeholder="Nota de 0 a 10">

        <label>Segunda nota</label>
        <input type="number" id="nota2" placeholder="Nota de 0 a 10">

        <label>Terceira nota</label>
        <input type="number" id="nota3" placeholder="Nota de 0 a 10">

        <button onclick="calcular()">Calcular média</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
