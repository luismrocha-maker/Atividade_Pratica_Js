
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>

    <div class="container">
        <h1>Cadastro de Alunos</h1>

        <label>Nome</label>
        <input type="text" id="nome" placeholder="Nome do aluno">

        <label>Idade</label>
        <input type="number" id="idade" placeholder="Idade">

        <label>Curso</label>
        <input type="text" id="curso" placeholder="Nome do curso">

        <label>Matrícula</label>
        <input type="text" id="matricula" placeholder="Número da matrícula">

        <button onclick="cadastrar()">Cadastrar aluno</button>

        <p id="mensagem"></p>

        <h2>Alunos cadastrados</h2>

        <div id="lista"></div>

        <h3 id="total">Total de alunos: 0</h3>
    </div>

    <script src="script4.js"></script>
</body>
</html>
